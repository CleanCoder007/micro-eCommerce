input {
  tcp {
    port => 5000
    codec => json
    type => "application_logs"
  }

  file {
    path => "/var/log/ecommerce/**/*.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => json
    type => "file_logs"
  }
}

filter {
  # Parse JSON logs from applications
  if [type] == "application_logs" {
    # Already JSON from codec
  } else if [type] == "file_logs" {
    # Try to parse as JSON if not already parsed
    if ![correlationId] {
      json {
        source => "message"
        target => "log_data"
      }
    }
  }

  # Extract correlation ID for indexing
  if [correlationId] {
    mutate {
      copy => { "correlationId" => "[@metadata][correlationId]" }
    }
  }

  # Filter sensitive data (passwords, tokens, credit cards)
  mutate {
    gsub => [
      "message", "password[\"']?\s*[:=]\s*[\"']?[^\"'\s,}]+", "password=***REDACTED***",
      "message", "token[\"']?\s*[:=]\s*[\"']?[^\"'\s,}]+", "token=***REDACTED***",
      "message", "credit[_-]?card[\"']?\s*[:=]\s*[\"']?[0-9\-\s]+", "credit_card=***REDACTED***",
      "message", "authorization[\"']?\s*[:=]\s*[\"']?Bearer\s+[^\"'\s,}]+", "authorization=***REDACTED***"
    ]
  }

  # Parse stack traces for better indexing
  if [stack_trace] {
    mutate {
      gsub => [ "stack_trace", "\n", " | " ]
    }
  }

  # Add environment and service metadata for enrichment
  mutate {
    add_field => {
      "[@metadata][service]" => "%{serviceName}"
      "[@metadata][environment]" => "%{environment}"
      "[@metadata][timestamp]" => "%{@timestamp}"
    }
  }

  # Extract top error types for alerting
  if [exceptionType] {
    mutate {
      add_field => { "[@metadata][error_type]" => "%{exceptionType}" }
    }
  }

  # Determine log level severity
  if [level] == "ERROR" or [level] == "FATAL" {
    mutate {
      add_field => { "[@metadata][severity]" => "critical" }
    }
  } else if [level] == "WARN" {
    mutate {
      add_field => { "[@metadata][severity]" => "warning" }
    }
  }
}

output {
  # Send to Elasticsearch with daily indices
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
    index => "ecommerce-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"

    # Use correlation ID for document routing (better aggregation)
    routing => "%{[@metadata][correlationId]}"

    # Retry policy
    retry_on_conflict => 3
  }

  # Send critical errors to a separate index for monitoring
  if [@metadata][severity] == "critical" {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOST:localhost}:${ELASTICSEARCH_PORT:9200}"]
      index => "ecommerce-critical-logs-%{+YYYY.MM.dd}"
      document_type => "_doc"
      retry_on_conflict => 3
    }
  }

  # Debug output to console (can be disabled in production)
  if [@metadata][severity] == "critical" {
    stdout {
      codec => json
    }
  }
}
