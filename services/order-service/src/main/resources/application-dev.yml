spring:
  jpa:
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
    show-sql: true
  datasource:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 20000
      leak-detection-threshold: 60000

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info,env,loggers
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    enable:
      jvm: true
      process: true
      system: true
      logback: true
      cache: true
      jdbc: true

metrics:
  database:
    enabled: true
