server:
  port: 8081

spring:
  application:
    name: customer-service
  config:
    import: "optional:configserver:http://localhost:8888/"
  flyway:
    enabled: true
    baselineOnMigrate: true
    validateOnMigrate: true
    locations: classpath:db/migration
    outOfOrder: false
  datasource:
    url: ${DB_URL:jdbc:h2:mem:customer_db}
    driverClassName: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  h2:
    console:
      enabled: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
    password: ${REDIS_PASSWORD:}
  cache:
    type: redis
    redis:
      time-to-live: 600000
      key-prefix: "customer-service:"

resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
        recordExceptions:
          - java.net.ConnectException
          - java.io.IOException
          - java.util.concurrent.TimeoutException
        ignoreExceptions:
          - com.ecommerce.common.exception.ValidationException
    instances:
      customerService:
        baseConfig: default
      restClient:
        baseConfig: default
        waitDurationInOpenState: 30s
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 100ms
        intervalFunction: exponential
        exponentialBackoffMultiplier: 2.0
        retryExceptions:
          - java.net.ConnectException
          - java.net.SocketTimeoutException
          - java.io.IOException
        ignoreExceptions:
          - com.ecommerce.common.exception.ValidationException
          - org.springframework.web.client.HttpClientErrorException
    instances:
      customerService:
        baseConfig: default
      restClient:
        baseConfig: default
        maxAttempts: 3
        waitDuration: 200ms
        exponentialBackoffMultiplier: 2.0
  timelimiter:
    configs:
      default:
        cancelRunningFuture: false
        timeoutDuration: 5s
    instances:
      customerService:
        baseConfig: default
      restClient:
        baseConfig: default
        timeoutDuration: 10s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: ${JWT_SECRET:changeme-use-strong-key-in-production}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
      environment: local
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    com.ecommerce: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

metrics:
  database:
    enabled: true
