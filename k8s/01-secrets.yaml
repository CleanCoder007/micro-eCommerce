---
# Development Environment Secrets
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-dev
type: Opaque
stringData:
  jwt-secret: "dev-jwt-secret-key-change-in-production"
  db-username: "ecommerce_dev"
  db-password: "dev-postgres-password"
  redis-password: "dev-redis-password"
  kafka-sasl-password: "dev-kafka-password"
  config-repo-username: "admin"
  config-repo-password: "admin"
  api-key: "dev-api-key-123456"

---
# Staging Environment Secrets
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-staging
type: Opaque
stringData:
  jwt-secret: "staging-jwt-secret-key-secure"
  db-username: "ecommerce_staging"
  db-password: "staging-postgres-password-secure"
  redis-password: "staging-redis-password-secure"
  kafka-sasl-password: "staging-kafka-password-secure"
  config-repo-username: "admin"
  config-repo-password: "admin"
  api-key: "staging-api-key-789012"

---
# Production Environment Secrets
# NOTE: In production, use external secret management (Vault, AWS Secrets Manager, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: ecommerce-prod
type: Opaque
stringData:
  jwt-secret: "REPLACE_WITH_SECURE_JWT_SECRET"
  db-username: "ecommerce_prod"
  db-password: "REPLACE_WITH_SECURE_DB_PASSWORD"
  redis-password: "REPLACE_WITH_SECURE_REDIS_PASSWORD"
  kafka-sasl-password: "REPLACE_WITH_SECURE_KAFKA_PASSWORD"
  config-repo-username: "admin"
  config-repo-password: "REPLACE_WITH_SECURE_CONFIG_PASSWORD"
  api-key: "REPLACE_WITH_PRODUCTION_API_KEY"

---
# Docker Registry Secret - Development
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: ecommerce-dev
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_GITHUB_TOKEN_BASE64"}}}'

---
# Docker Registry Secret - Staging
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: ecommerce-staging
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_GITHUB_TOKEN_BASE64"}}}'

---
# Docker Registry Secret - Production
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-secret
  namespace: ecommerce-prod
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"REPLACE_WITH_GITHUB_TOKEN_BASE64"}}}'
