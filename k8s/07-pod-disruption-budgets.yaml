---
# Pod Disruption Budget for API Gateway - Development
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: ecommerce-dev
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api-gateway

